<h1>Bài giảng Day 12 — đoạn G12-034</h1>
<p>Câu hỏi đầu tiên cần trả lời không phải dùng kỹ thuật nào, mà là tài liệu của mình có đặc điểm gì.</p>
<p>Nếu bạn phải trả lời được câu hỏi này lấy ở đâu ra, thì bạn cần truy hồi, không phải nhồi.</p>
